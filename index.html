<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Steel Storm</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%224%22 width=%2212%22 height=%228%22 rx=%221%22 fill=%22%235d7a3a%22/%3E%3Crect x=%227%22 y=%227%22 width=%229%22 height=%222%22 fill=%22%23333%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    html, body {
      margin: 0; height: 100%; background: #0b0f0c; overflow: hidden;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    canvas { display: block; cursor: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #e8d36a; font: 22px "Russo One", Impact, sans-serif; letter-spacing: 0.1em;
      background: radial-gradient(circle at center, #1a2218, #070907);
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="loading">GENERATING BATTLEFIELD…</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
